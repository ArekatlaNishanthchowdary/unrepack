[package]
name = "unrepack"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0" # except src/builtin.rs and src/tornado.rs: see LICENSE-FREEARC
repository = "https://github.com/ArekatlaNishanthchowdary/unrepack"

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.5"
eframe = "0.37.0"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std"] }
rfd = "0.18.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.27.0"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std", "encoder"] }
