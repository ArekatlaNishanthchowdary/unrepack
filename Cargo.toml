[package]
name = "unrepack"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0" # except src/builtin.rs: see LICENSE-FREEARC
repository = "https://github.com/ArekatlaNishanthchowdary/unrepack"

[dependencies]
anyhow = "1.0.104"
crc32fast = "1.5.5"
lzma-rust2 = { version = "0.24", default-features = false, features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3.27.0"
