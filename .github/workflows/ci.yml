name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # only the tag-only release step writes
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # A 32-bit gcc: the CLS host and the test codec are 32-bit, like a
      # repack's cls-*.dll. Without it the CLS tests would skip, not fail.
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          install: mingw-w64-i686-gcc
          update: false

      - name: Put the 32-bit gcc on PATH
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ steps.msys2.outputs.msys2-location }}\mingw32\bin"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      - name: Build
        shell: bash
        run: |
          cargo build --release
          gcc -m32 -O2 -s -static -o target/release/unrepack-clshost.exe clshost/clshost.c

      - name: Test (the CLS tests must run, not skip)
        shell: bash
        run: |
          cargo test --release -- --nocapture 2>&1 | tee test.log
          if grep -q "skipping CLS tests" test.log; then
            echo "::error::gcc -m32 was not found, so the CLS tests were skipped"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: unrepack-windows-x64
          path: |
            target/release/unrepack.exe
            target/release/unrepack-gui.exe
            target/release/unrepack-clshost.exe
            README.md
            LICENSE-*

      # A v* tag makes a draft release with the ready-to-run zip, built and
      # tested above, so nobody needs the source. The owner publishes it.
      - name: Draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$ver" -ne $tag) { throw "tag $tag doesn't match Cargo.toml version $ver" }
          $name = "unrepack-$ver-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/unrepack.exe, target/release/unrepack-gui.exe, target/release/unrepack-clshost.exe, README.md, LICENSE-* $name
          Compress-Archive $name "$name.zip"
          $hash = (Get-FileHash "$name.zip" -Algorithm SHA256).Hash.ToLower()
          Set-Content "$name.zip.sha256" "$hash *$name.zip" -NoNewline
          gh release create $tag "$name.zip" "$name.zip.sha256" --draft --title "unrepack $ver" --generate-notes
